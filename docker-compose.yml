services:

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: financehub-api

    ports:
      - "8080:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development

      OTEL_SERVICE_NAME: "financehub-api"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"

      Jwt__Key: "${JWT_KEY}"

      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=FinanceHubDb;User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=True;"
      
      Redis__ConnectionString: "redis:6379"

    depends_on:
      sqlserver:
        condition: service_healthy

      redis:
        condition: service_healthy


  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest

    container_name: financehub-sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_PASSWORD}"

    ports:
      - "1433:1433"

    volumes:
      - sqlserver_data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


  rabbitmq:
    image: rabbitmq:4-management

    container_name: financehub-rabbitmq

    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test:
        [
          "CMD",
          "rabbitmq-diagnostics",
          "-q",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  outbox-worker:
    build:
      context: .
      dockerfile: FinanceHub.Outbox.Worker/Dockerfile

    container_name: financehub-outbox-worker

    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=FinanceHubDb;User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=True;"
      RabbitMq__HostName: "rabbitmq"
      RabbitMq__UserName: "${RABBITMQ_USERNAME}"
      RabbitMq__Password: "${RABBITMQ_PASSWORD}"
      AWS_PROFILE: default
      AWS__Region: us-east-1
      SQS__QueueUrl: "https://sqs.us-east-1.amazonaws.com/116622473866/compras-queue"

    volumes:
      - ${USERPROFILE}/.aws:/root/.aws:ro

    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy


  carteira-worker:
    build:
      context: .
      dockerfile: FinanceHub.Carteira.Worker/Dockerfile

    container_name: financehub-carteira-worker

    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=FinanceHubDb;User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=True;"
      RabbitMq__HostName: "rabbitmq"
      RabbitMq__UserName: "${RABBITMQ_USERNAME}"
      RabbitMq__Password: "${RABBITMQ_PASSWORD}"
      AWS_PROFILE: default
      AWS__Region: us-east-1
      SQS__QueueUrl: "https://sqs.us-east-1.amazonaws.com/116622473866/compras-queue"

    volumes:
      - ${USERPROFILE}/.aws:/root/.aws:ro
    
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy


  redis:
    image: redis:7-alpine

    container_name: financehub-redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  prometheus:
    image: prom/prometheus:latest
    container_name: financehub-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus


  jaeger:
    image: jaegertracing/all-in-one:latest

    container_name: financehub-jaeger

    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"


volumes:
  sqlserver_data:
  rabbitmq_data:
  redis_data:
  prometheus_data: