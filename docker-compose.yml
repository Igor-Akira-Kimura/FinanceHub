services:

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: financehub-api

    ports:
      - "8080:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development

      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=FinanceHubDb;User Id=sa;Password=FinanceHub@123;TrustServerCertificate=True;"

      Redis__ConnectionString: "redis:6379"

    depends_on:
      sqlserver:
        condition: service_healthy

      redis:
        condition: service_healthy


  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest

    container_name: financehub-sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "FinanceHub@123"

    ports:
      - "1433:1433"

    volumes:
      - sqlserver_data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'FinanceHub@123' -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


  rabbitmq:
    image: rabbitmq:4-management

    container_name: financehub-rabbitmq

    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test:
        [
          "CMD",
          "rabbitmq-diagnostics",
          "-q",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  outbox-worker:
    build:
      context: .
      dockerfile: FinanceHub.Outbox.Worker/Dockerfile

    container_name: financehub-outbox-worker

    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=FinanceHubDb;User Id=sa;Password=FinanceHub@123;TrustServerCertificate=True;"
      RabbitMq__HostName: "rabbitmq"
      RabbitMq__UserName: "guest"
      RabbitMq__Password: "guest"

    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy


  carteira-worker:
    build:
      context: .
      dockerfile: FinanceHub.Carteira.Worker/Dockerfile

    container_name: financehub-carteira-worker

    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=FinanceHubDb;User Id=sa;Password=FinanceHub@123;TrustServerCertificate=True;"
      RabbitMq__HostName: "rabbitmq"
      RabbitMq__UserName: "guest"
      RabbitMq__Password: "guest"

    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy


  redis:
    image: redis:7-alpine

    container_name: financehub-redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sqlserver_data:
  rabbitmq_data:
  redis_data: